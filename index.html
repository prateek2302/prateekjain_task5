<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry Services - Hero Section</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">Logo</div>

    <nav class="nav-links">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#about">About Us</a>
      <a href="#contact">Contact Us</a>
    </nav>

    <div class="user-badge">
      <span class="user-name">Username</span>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-section">
    <!-- Left Column -->
    <div class="hero-left">
      <div class="hero-content">
        <h1>Revitalize Your Clothes with Expert <span>Laundry Services!</span></h1>
        <p>
          From premium dry cleaning to swift wash and fold, we deliver care and convenience. 
          Schedule a pickup and rediscover the freshness of your clothes today!
        </p>
        <a href="#book" class="cta-btn">Book a service today!</a>
      </div>
    </div>

    <!-- Right Column -->
    <div class="hero-right">
      <div class="hero-image-wrapper">
        <img 
          src="https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=900&q=80" 
          alt="Laundry Washing Machine Service" 
        />
      </div>
    </div>
  </main>

</body>
</html>
